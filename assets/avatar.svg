<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1B2D"/>
      <stop offset="1" stop-color="#1C2E4A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D989"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 天平立柱与横梁 -->
  <g stroke="#E8C46A" stroke-width="15" stroke-linecap="round" fill="none">
    <line x1="256" y1="132" x2="256" y2="352"/>
    <line x1="142" y1="190" x2="370" y2="190"/>
    <line x1="256" y1="132" x2="256" y2="112"/>
  </g>

  <!-- 左右吊线与托盘 -->
  <g stroke="#E8C46A" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="142" y1="190" x2="142" y2="252"/>
    <line x1="370" y1="190" x2="370" y2="252"/>
    <path d="M104 252 H180 Q180 300 142 300 Q104 300 104 252 Z"/>
    <path d="M332 252 H408 Q408 300 370 300 Q332 300 332 252 Z"/>
  </g>

  <!-- 基座 -->
  <g fill="#E8C46A">
    <rect x="188" y="352" width="136" height="16" rx="8"/>
    <rect x="212" y="378" width="88" height="12" rx="6"/>
  </g>

  <!-- 数据节点 -->
  <g fill="#F4D989">
    <circle cx="142" cy="190" r="11"/>
    <circle cx="370" cy="190" r="11"/>
    <circle cx="256" cy="112" r="13"/>
  </g>

  <!-- 细微电路线 -->
  <g stroke="#F4D989" stroke-width="4" opacity="0.35" stroke-linecap="round">
    <path d="M256 390 v22 h-54" fill="none"/>
    <path d="M256 390 v22 h54" fill="none"/>
    <circle cx="202" cy="412" r="6" fill="#F4D989" stroke="none"/>
    <circle cx="310" cy="412" r="6" fill="#F4D989" stroke="none"/>
  </g>
</svg>
